youtube_comment_listener_enabled: true
YOUTUBE_API_KEY: "AIzaSyAA96ihG7Y2TJnIFwa3DDM8Yuudi7jNeVU"  # Cloudニキ
#YOUTUBE_CHANNEL_ID: "UCaed2vGGhOMRxES7f1aXbqg"  # ITComeTrueチャンネル
YOUTUBE_CHANNEL_ID: "UC5xzmN_w-aL41GpV2pNshwg"
OBS_WS_HOST: "localhost"
OBS_WS_PORT: 4458
OBS_WS_PASSWORD: "l8uX5dtWnYmdWckI"
