      ignore_angle_brackets: true # 山括弧で囲まれた部分を無視

      translator_config:
        # 例: 英語で話して字幕を表示し、TTSは日本語で話す等
        translate_audio: false # DeeplXのデプロイが必要。未導入だとクラッシュ
